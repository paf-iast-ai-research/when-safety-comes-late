[project]
name = "when-safety-comes-late"
version = "0.1.0"
description = "Pre-registered study: constraint-onset timing and robustness in constrained RL, with Constraint-Coverage Generalization"
requires-python = "==3.10.*"

[tool.pytest.ini_options]
# The repository root is on sys.path, so the top-level packages (and `results`, which has no
# __init__.py) import under plain `pytest` as under `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"  # `pytest -m slow` runs the slow tests
markers = [
    "omnisafe: needs the pinned OmniSafe stack (skipped when omnisafe is not installed)",
    "slow: takes minutes (short OmniSafe training runs, fixed-batch collection, the full-resample analysis)",
]
