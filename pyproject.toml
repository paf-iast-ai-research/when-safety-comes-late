[project]
name = "when-safety-comes-late"
version = "0.1.0"
description = "Pre-registered study: constraint-onset timing and robustness in constrained RL, with Constraint-Coverage Generalization"
requires-python = "==3.10.*"

[tool.pytest.ini_options]
# The repository root is on sys.path, so `results`, `configs` and `pilot` import without
# __init__ files or `python -m pytest` (plain `pytest` failed to import `results` before).
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"  # `pytest -m slow` runs the training tests
markers = [
    "omnisafe: needs the pinned OmniSafe stack (skipped when omnisafe is not installed)",
    "slow: trains a short OmniSafe run (minutes)",
]
